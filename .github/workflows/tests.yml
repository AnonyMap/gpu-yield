name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install zstd
        run: sudo apt-get install -y zstd
      - name: Self-test
        run: python3 gpu-yield --version
      - name: Run tests
        run: python3 tests/run_tests.py
